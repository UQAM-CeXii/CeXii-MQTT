; Exemple 5 : envoyer et recevoir une table.
;
; Pour utiliser VOTRE copie de la bibliothèque, remplacez la ligne "symlink://..."
; par l'adresse du dépôt :  lib_deps = https://github.com/VOTRE-COMPTE/saillance-mqtt.git
; Ce dossier contient un croquis Arduino (.ino) : PlatformIO le lit directement ici.
[platformio]
src_dir = .

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    symlink://../..
