; Exemple 1 : envoyer 3 valeurs (r, g, b) sur un topic, en WiFi.
;
; Pour utiliser VOTRE copie de la bibliothèque, remplacez la ligne "symlink://..."
; par l'adresse du dépôt :  lib_deps = https://github.com/VOTRE-COMPTE/saillance-mqtt.git
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1   ; fait remonter aussi les erreurs log_e() vers MQTT
lib_deps =
    symlink://../..
