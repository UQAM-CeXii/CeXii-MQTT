; Environnement de DÉVELOPPEMENT de la bibliothèque (tests sur l'ordinateur).
; Les utilisateurs de la bibliothèque n'ont pas besoin de ce fichier :
; voir les dossiers examples/ pour des projets prêts à l'emploi.
;
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Isrc
lib_deps = bblanchon/ArduinoJson@^7.0.0
